name: DevBox CI
on:
  push:
    branches: [main, v2, feat/*]
  pull_request:
    branches: [main, v2]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run shellcheck
        run: shellcheck --severity=error devbox.sh lib/*.sh bootstrap.sh tests/*.sh

  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit test suite
        run: bash tests/run_tests.sh

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu:latest
          - fedora:latest
          - archlinux:latest
          - alpine:latest
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bash (required for devbox)
        run: |
          command -v bash && exit 0
          if command -v apk; then apk add --no-cache bash
          elif command -v dnf; then dnf install -y bash
          elif command -v zypper; then zypper install -y bash
          fi
      - name: Make scripts executable
        run: chmod +x devbox.sh lib/*.sh
      - name: Check distro detection
        run: bash devbox.sh --version
      - name: Run distro command
        run: bash devbox.sh distro
      - name: Run doctor
        run: bash devbox.sh doctor || echo "Doctor may fail in container (expected)"
      - name: Test install
        run: |
          set +e
          bash devbox.sh install 2>&1 | tee /tmp/install.log; rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "WARN: install exited $rc — Docker, systemd, and firewall are documented container limitations"
          fi
      - name: Snapshot state for idempotency
        if: always()
        run: |
          if command -v dpkg &>/dev/null; then dpkg --get-selections 2>/dev/null | sort
          elif command -v rpm &>/dev/null; then rpm -qa 2>/dev/null | sort
          elif command -v pacman &>/dev/null; then pacman -Q 2>/dev/null | sort
          elif command -v apk &>/dev/null; then apk info -v 2>/dev/null | sort
          else echo "unknown"
          fi > /tmp/state_before
      - name: Test idempotency (install again)
        if: always()
        run: |
          set +e
          bash devbox.sh install 2>&1 | tee /tmp/install2.log; rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "WARN: second install exited $rc — container limitations"
          fi
          if command -v dpkg &>/dev/null; then dpkg --get-selections 2>/dev/null | sort
          elif command -v rpm &>/dev/null; then rpm -qa 2>/dev/null | sort
          elif command -v pacman &>/dev/null; then pacman -Q 2>/dev/null | sort
          elif command -v apk &>/dev/null; then apk info -v 2>/dev/null | sort
          else echo "unknown"
          fi > /tmp/state_after
          if diff /tmp/state_before /tmp/state_after >/dev/null 2>&1; then
            echo "PASS: Idempotent — no changes on second install"
          else
            echo "FAIL: System state changed after second install"
            diff /tmp/state_before /tmp/state_after
            exit 1
          fi
