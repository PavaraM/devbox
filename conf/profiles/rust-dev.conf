# Rust development profile
PROFILE_DESC="Rust development — Rust compiler, Cargo, build tools"
PROFILE_PACKAGES=(git curl wget vim htop tmux unzip tree ca-certificates build-essential)
PROFILE_INSTALL_DOCKER=false
PROFILE_HARDEN=false
PROFILE_SETUP_USER=""
# Installed via rustup after base packages
PROFILE_EXTRA_CMDS=("curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y")
