# Cloud development profile — Docker, Kubernetes, Terraform
PROFILE_DESC="Cloud development — Docker, kubectl, Helm, Terraform"
PROFILE_PACKAGES=(git curl wget vim htop tmux unzip tree ca-certificates build-essential python3 python3-pip)
PROFILE_INSTALL_DOCKER=true
PROFILE_HARDEN=false
PROFILE_SETUP_USER=""
PROFILE_EXTRA_CMDS=(
  "curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg"
)
